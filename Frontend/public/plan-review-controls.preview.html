<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案操作组件验收</title><link rel="stylesheet" href="/src/case-workbench.css"><link rel="stylesheet" href="/src/expectation-review.css"><style>body{margin:0;background:var(--cw-surface);color:var(--cw-ink);font-family:var(--cw-font)}main{max-width:540px;margin:40px auto;padding:20px}section{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px;border-bottom:1px solid var(--cw-line)}button{min-width:130px;min-height:44px;border:1px solid transparent;border-radius:10px;background:var(--cw-accent);color:var(--cw-surface);font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,.focus{outline:2px solid var(--cw-accent);outline-offset:4px}.hover{filter:brightness(1.08)}.active{transform:translateY(1px)}small{display:block;margin-top:8px;color:var(--cw-muted)}@media(hover:hover){button:hover{filter:brightness(1.08)}}button:active{transform:translateY(1px)}</style><main><h1>方案操作组件</h1><section><span>默认</span><button>确认预期结果</button></section><section><span>悬停</span><button class="hover">确认预期结果</button></section><section><span>键盘焦点</span><button class="focus">确认预期结果</button></section><section><span>按下</span><button class="active">确认预期结果</button></section><section><span>禁用</span><button disabled>确认预期结果</button></section><section><span>加载</span><button disabled aria-busy="true">确认中…</button></section><section><span>错误<small>方案已更新，请刷新后再修改。</small></span><button>保存修改</button></section><section><span>成功<small>关闭弹窗，显示更新后的方案。</small></span><button>查看方案</button></section></main></html>
