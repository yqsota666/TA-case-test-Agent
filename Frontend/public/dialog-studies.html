<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片与详情 · 视觉预览</title><link rel="stylesheet" href="/dialog-studies.css"></head><body data-skin="paper"><header class="study-header"><div><strong>卡片与详情</strong><span>视觉预览 · 不调用接口</span></div><nav aria-label="视觉方向"><button data-skin="paper">纸面审阅</button><button data-skin="graphite">工件工作台</button><button data-skin="pearl">光谱悬浮</button></nav></header><main><section class="source-note"><p id="source-description"></p><a id="source-link" target="_blank" rel="noreferrer">查看官方产品参考 ↗</a></section><section class="preview-stage"><div class="message"><small>方案与数据</small><p id="objective"></p><div id="cards"></div></div></section><section class="fixture-tools"><label>内容检查 <select id="fixture"><option value="all">完整案例</option><option value="one">单个测试项</option><option value="two">两个测试项</option><option value="long">长文本</option><option value="empty">缺少内容</option><option value="non-comparison">不作对比</option></select></label><button id="show-states">查看组件状态</button></section><section id="states" hidden><h2>组件状态 · 仅供验收</h2><div id="state-grid"></div></section></main><dialog id="detail" aria-labelledby="dialog-title"><header class="dialog-header"><div class="dialog-heading"><span id="dialog-icon"></span><h2 id="dialog-title"></h2></div><button class="icon-button" id="close" aria-label="关闭">×</button></header><div class="detail-layout"><nav id="detail-navigation" aria-label="详情目录"></nav><div class="dialog-body" id="dialog-body"></div></div><footer class="dialog-footer"><span>仅预览，未提交更改</span><button id="dismiss">关闭</button></footer></dialog><dialog id="row-editor" class="row-editor" aria-labelledby="edit-title"><header class="dialog-header"><div class="dialog-heading"><h2 id="edit-title"></h2></div><button class="icon-button" id="edit-close" aria-label="关闭修改">×</button></header><form id="edit-form" class="dialog-body edit-fields"></form><footer class="dialog-footer"><span>仅保存在本次预览，不提交项目。</span><div class="edit-actions"><button id="edit-cancel" type="button">取消</button><button class="edit-save" type="submit" form="edit-form">保存预览</button></div></footer></dialog><script type="module" src="/dialog-studies.js"></script></body></html>
