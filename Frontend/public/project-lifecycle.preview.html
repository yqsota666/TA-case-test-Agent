<!doctype html><html lang="zh-CN" data-theme="liquid"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目与复测组件预览</title><link rel="stylesheet" href="/src/case-workbench.css"><link rel="stylesheet" href="/src/spectral-components.css"></head><body><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import{ProjectLifecycleDialog}from'/src/project-lifecycle.jsx';
const variants={active:{status:'ACTIVE',canClose:false},complete:{status:'ACTIVE',canClose:true},sealed:{status:'CLOSED',canClose:false},empty:{status:'ACTIVE',canClose:false}};
const kind=new URLSearchParams(location.search).get('state')||'active';const variant=variants[kind]||variants.active;
let snapshot={chat:{publicId:'preview',title:'组件预览（仅本地模拟）',status:variant.status},canClose:variant.canClose,cases:kind==='empty'?[]:[{publicId:'a',title:'记录校验',status:kind==='complete'?'PASS':'FAIL',finalVerdict:kind==='complete'?'PASS':'FAIL'},{publicId:'b',title:'字段对照',status:'PASS',finalVerdict:'PASS'}]};
async function request(path,body){await new Promise(resolve=>setTimeout(resolve,400));if(!body)return structuredClone(snapshot);if(path.endsWith('/close')){snapshot.chat.status=body.mode==='NORMAL'?'CLOSED':'FORCE_CLOSED';snapshot.chat.closedAt=new Date().toISOString();snapshot.chat.closeReason=body.reason;snapshot.canClose=false;return{status:snapshot.chat.status};}if(path.endsWith('/retest')){snapshot.cases.push({publicId:'c',title:'记录校验',status:'DISCUSSING',predecessorCasePublicId:'a'});return{chatPublicId:'preview',casePublicId:'c'};}return{chatPublicId:'new-preview'};}
createRoot(document.getElementById('root')).render(React.createElement(ProjectLifecycleDialog,{chatId:'preview',caseId:'a',request,onClose:()=>location.reload(),onNavigate:()=>location.reload()}));
</script></body></html>
