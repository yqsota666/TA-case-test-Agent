<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case 讨论</title>
  <link rel="stylesheet" href="/case.css">
  <script src="/case.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Case 工作台</p>
      <h1>讨论测试方案</h1>
      <p>打开已有 Case，讨论测试目标，再审阅并确认 Plan。</p>
    </header>
    <form id="open-case" class="case-picker">
      <label>Chat ID <input id="chat-id" required autocomplete="off" placeholder="粘贴 Chat UUID"></label>
      <label>Case ID <input id="case-id" required autocomplete="off" placeholder="粘贴 Case UUID"></label>
      <button type="submit">打开 Case</button>
    </form>
    <p id="status" role="status" aria-live="polite">输入已有 Chat 和 Case ID 后打开对话。</p>
    <section aria-labelledby="conversation-title">
      <div class="section-heading"><h2 id="conversation-title">对话记录</h2><span id="revision"></span></div>
      <ol id="turns" aria-live="polite"></ol>
    </section>
    <form id="compose" hidden>
      <label for="message">继续讨论或修改方案</label>
      <textarea id="message" rows="4" maxlength="4000" required placeholder="写下测试需求、补充信息或需要修改的地方"></textarea>
      <div class="actions"><button type="submit">发送讨论</button><button id="propose" type="button">生成 Plan 提案</button></div>
    </form>
    <section id="plan-panel" hidden aria-labelledby="plan-title">
      <h2 id="plan-title">待审阅 Plan</h2>
      <p id="plan-state"></p>
      <pre id="plan-content"></pre>
      <button id="confirm" type="button">确认当前版本</button>
    </section>
  </main>
</body>
</html>
