services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sales
      MYSQL_USER: sales
      MYSQL_PASSWORD: sales
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./services/sales/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: OracleDemo123
      ORACLE_CHARACTERSET: AL32UTF8
    ports: ["1521:1521"]
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | sqlplus -s system/$$ORACLE_PWD@localhost:1521/FREEPDB1 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40

  oracle-init:
    image: container-registry.oracle.com/database/free:latest
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      "user_count=$$(printf \"set heading off feedback off pages 0\nselect count(*) from cdb_users where username='TA';\n\" |
      sqlplus -s system/OracleDemo123@oracle:1521/FREE | tr -d '[:space:]');
      if [ \"$$user_count\" = \"1\" ]; then echo 'TA schema already initialized';
      else echo exit | sqlplus -s system/OracleDemo123@oracle:1521/FREE @/init/01_schema.sql; fi"
    environment:
      NLS_LANG: AMERICAN_AMERICA.AL32UTF8
    volumes:
      - ./services/ta/sql/01_schema.sql:/init/01_schema.sql:ro
    depends_on:
      oracle: { condition: service_healthy }

  sftp:
    image: atmoz/sftp:alpine
    command: exchange:exchange:1001:1001:upload
    ports: ["2222:22"]
    volumes:
      - sftp-data:/home/exchange
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  sales-service:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    environment:
      DB_HOST: mysql
      DB_USER: sales
      DB_PASSWORD: sales
      DB_NAME: sales
      TRANSPORT_MODE: sftp
      SFTP_HOST: sftp
      SFTP_USER: exchange
      SFTP_PASSWORD: exchange
      SFTP_ROOT: /upload
      STORAGE_MODE: ${STORAGE_MODE:-local}
      ARTIFACT_ROOT: /artifacts
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_STS_TOKEN: ${OSS_STS_TOKEN:-}
      OSS_PREFIX: ${OSS_PREFIX:-fund-data-factory}
      SELF_API_URL: http://127.0.0.1:8081/api
      TA_API_URL: http://ta-service:8082/api
      ORG_CODE: "305"
      TA_CODE: "27"
    volumes:
      - artifact-data:/artifacts
    ports: ["8081:8081"]
    depends_on:
      mysql: { condition: service_healthy }
      sftp: { condition: service_healthy }

  ta-service:
    build:
      context: .
      dockerfile: services/ta/Dockerfile
    environment:
      DB_CONNECT: oracle:1521/FREEPDB1
      DB_USER: ta
      DB_PASSWORD: ta
      TRANSPORT_MODE: sftp
      SFTP_HOST: sftp
      SFTP_USER: exchange
      SFTP_PASSWORD: exchange
      SFTP_ROOT: /upload
      STORAGE_MODE: ${STORAGE_MODE:-local}
      ARTIFACT_ROOT: /artifacts
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_STS_TOKEN: ${OSS_STS_TOKEN:-}
      OSS_PREFIX: ${OSS_PREFIX:-fund-data-factory}
      ORG_CODE: "27"
      SALES_CODE: "305"
    volumes:
      - artifact-data:/artifacts
    ports: ["8082:8082"]
    depends_on:
      oracle-init: { condition: service_completed_successfully }
      sftp: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["5173:80"]
    depends_on: [sales-service, ta-service]

volumes:
  mysql-data:
  oracle-data:
  sftp-data:
  artifact-data:
